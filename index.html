<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro EBAC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <h1>Parquímetro</h1>

    <p class="descricao">
        Informe o valor inserido no parquímetro para calcular o tempo de permanência e o troco.
    </p>

    <section class="tabela-valores">
        <h2>Tabela de valores</h2>

        <ul>
            <li>R$ 1,00 — 30 minutos</li>
            <li>R$ 1,75 — 60 minutos</li>
            <li>R$ 3,00 — 120 minutos</li>
        </ul>
    </section>

    <form id="formulario-parquimetro">
        <label for="valor">Valor inserido:</label>

        <input
                type="number"
                id="valor"
                min="0"
                step="0.01"
                placeholder="Ex: 1.75"
                required
        >

        <button type="submit">Calcular</button>
    </form>

    <section class="resultado">
        <p id="mensagem">Informe um valor para calcular o tempo.</p>
        <p id="tempo"></p>
        <p id="troco"></p>
    </section>
</main>

<script src="scripts.js"></script>
</body>
</html>
